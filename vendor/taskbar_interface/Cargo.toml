[package]
name = "taskbar_interface"
version = "0.1.0"
edition = "2018"
license = "MIT"
description = "An interface to the desktop taskbar"
documentation = "https://docs.rs/taskbar_interface"
repository = "https://github.com/sandmor/taskbar_interface"
readme = "README.md"
keywords = ["taskbar", "interfaces", "ui"]
categories = ["gui"]

[dependencies]
raw-window-handle = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
once_cell = "1.18"

[target.'cfg(target_os = "macos")'.dependencies.objc2]
version = "0.5.3"

[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
version = "0.2.2"
features = [
    "NSApplication",
    "NSControl",
    "NSDockTile",
    "NSImage",
    "NSImageView",
    "NSProgressIndicator",
    "NSResponder",
    "NSView",
]

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "0.2.2"
features = [
    "NSGeometry",
    "NSThread",
]

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
once_cell = "1.18"
x11-dl = "2"
dbus = "0.9"
x11rb = { version = "0.11", features = ["allow-unsafe-code", "dl-libxcb"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_SystemServices",
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }


