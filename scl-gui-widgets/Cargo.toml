[package]
name = "scl-gui-widgets"
version = "2.0.0"
edition = "2024"
rust-version = "1.88"
description = "WinUI-style Iced widgets for SCL. (Highly unstable and all in Chinese!)"
homepage = "https://github.com/Steve-xmh/scl"
repository = "https://github.com/Steve-xmh/scl"
license = "LGPL-3.0-only"
readme = "README.md"
authors = ["Steve-xmh <stevexmh@qq.com>"]

[dependencies]
iced = { version = "0.14", default-features = false, features = [
    "tiny-skia",
    "svg",
    "image",
    "crisp",
    "thread-pool",
    "x11",
    "wayland",
] }
serde = { version = "1.0", features = ["derive"] }

[[example]]
name = "widget_test"
path = "examples/widget_test.rs"
