[package]
name = "scl-gui-iced"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Iced (tiny-skia) migration of the SCL GUI widget library."
homepage = "https://github.com/Steve-xmh/scl"
repository = "https://github.com/Steve-xmh/scl"
license = "LGPL-3.0-only"
readme = "README.md"
authors = ["Steve-xmh <stevexmh@qq.com>"]

[dependencies]
iced = { version = "0.14", default-features = false, features = [
    "tiny-skia",
    "svg",
    "image",
    "crisp",
    "thread-pool",
    "x11",
    "wayland",
] }

[[example]]
name = "widget_test"
path = "examples/widget_test.rs"

[[example]]
name = "launcher"
path = "examples/launcher.rs"
