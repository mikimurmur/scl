[package]
name = "scl-core"
description = "A fully featured minecraft launcher core. (Highly unstable and all in Chinese!)"
version = "1.0.2"
homepage = "https://github.com/Steve-xmh/scl"
repository = "https://github.com/Steve-xmh/scl"
license = "LGPL-3.0-only"
readme = "README.md"
authors = ["Steve-xmh <stevexmh@qq.com>"]
edition = "2021"
rust-version = "1.75"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "^1.0"
base64 = "^0.21"
# 使用系统 TLS（Linux/Windows/macOS 分别走 OpenSSL / SChannel / Security.framework），
# 不启用 ureq 默认的 rustls，避免把 TLS 栈静态链进可执行文件。
ureq = { version = "^2.12", default-features = false, features = ["gzip", "native-tls"] }
rayon = "=1.10.0"
image = { version = "^0.24", default-features = false, features = ["jpeg", "png", "gif", "bmp", "rgb"] }
webp = "^0.2"
nom = "^7.1"
path-absolutize = "^3.0"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
sha1_smol = { version = "^1.0", features = ["std"] }
shlex = "1.3"
toml = "^0.8"
url = { version = "^2.2", features = ["serde"] }
urlencoding = "^2.1"
concat-string = "^1.0"
md5 = "^0.7"
zip = { version = "2.6", default-features = false, features = ["aes-crypto", "bzip2", "deflate", "time", "zstd"] }
dirs = "^5.0"
fs-err = "3"
tracing = "^0.1"

[target.'cfg(target_os = "windows")'.dependencies]
winsplit = "0.1"
winreg = "^0.52"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.52"
features = [
    "Win32_System_Diagnostics_Debug",
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(target_os = "macos")'.dependencies]
libc = "^0.2"
# nix = { version =  "*", features = ["feature"] }
