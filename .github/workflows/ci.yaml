name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rustfmt:
    name: 语法格式检查
    runs-on: ubuntu-latest
    steps:
      - name: 克隆仓库
        uses: actions/checkout@v4

      # rustfmt.toml 使用了 unstable 选项，必须用 nightly 的 rustfmt。
      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: 运行 cargo fmt 格式检查
        run: cargo fmt --all -- --check

  test:
    name: 编译&测试（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: 克隆仓库
        uses: actions/checkout@v4

      - name: Linux - 安装构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libssl-dev pkg-config

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # taskbar_interface 的 windows = "*" 会解析到 windows 0.62，其
      # HWND(*mut c_void) 与该 crate 的 `as isize` 写法冲突；固定到 0.52。
      - name: Windows - 固定 windows 依赖版本
        if: runner.os == 'Windows'
        run: cargo update -p windows@0.62.2 --precise 0.52.0

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace

      - name: 构建 release 产物
        run: cargo build -p sharp_craft_launcher --release
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MICROSOFT_LEGACY_CLIENT_ID: ${{ secrets.MICROSOFT_LEGACY_CLIENT_ID }}
          SCL_MICROSOFT_CLIENT_ID: ${{ secrets.SCL_MICROSOFT_CLIENT_ID }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: SharpCraftLauncher-${{ github.sha }}-${{ matrix.os }}
          path: |
            target/release/SharpCraftLauncher
            target/release/SharpCraftLauncher.exe
