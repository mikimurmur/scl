[package]
name = "sharp_craft_launcher"
description = "A super light, fast, clean minecraft launcher framework written in rust."
version = "1.2.0"
homepage = "https://github.com/Steve-xmh/scl"
repository = "https://github.com/Steve-xmh/scl"
license = "LGPL-3.0-only"
readme = "README.md"
authors = ["Steve-xmh <stevexmh@qq.com>"]
edition = "2021"
rust-version = "1.82"

[[bin]]
name = "SharpCraftLauncher"
path = "src/main.rs"

[dependencies]
scl-core = { path = "../scl-core" }
scl-gui-widgets = { path = "../scl-gui-widgets" }
scl-gui-animation = { path = "../scl-gui-animation" }
scl-macro = { path = "../scl-macro" }
druid = { git = "https://github.com/linebender/druid.git", features = ["im", "serde", "raw-win-handle"] }
im = { version = "15.1", features = ["serde"] }
anyhow = "^1.0"
dirs = "5"
fs-err = "3"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
toml = "^0.8"
image = { version = "^0.24", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
tracing = "^0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "^0.4"
fastrand = "1.9"
base64 = "^0.21"
zip = { version = "2.6", default-features = false, features = ["deflate"] }
rayon = "=1.10.0"

[target.'cfg(target_os = "linux")'.dependencies]
# 原版 Linux 的非致命后台任务错误弹窗使用 GTK MessageDialog；
# druid 的 GTK 后端已经初始化 GTK，可直接复用同一套 GTK 主循环。
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
# 本地 vendored 版本把 windows 依赖升级到 0.62，修复上游 git 依赖的 0.52 锁定。
taskbar_interface = { path = "../vendor/taskbar_interface" }
raw-window-handle-5 = { package = "raw-window-handle", version = "0.5" }

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

# 把 assets/logo.ico 编译进 Windows 可执行文件；Druid 的 Windows 后端会
# 用 LoadIconW(MAKEINTRESOURCEW(1)) 取这个图标作为窗口图标。
[build-dependencies]
winresource = { version = "0.1.34", default-features = false }
