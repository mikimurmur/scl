[package]
name = "sharp_craft_launcher"
description = "A super light, fast, clean minecraft launcher framework written in rust."
version = "1.2.0"
homepage = "https://github.com/Steve-xmh/scl"
repository = "https://github.com/Steve-xmh/scl"
license = "LGPL-3.0-only"
readme = "README.md"
authors = ["Steve-xmh <stevexmh@qq.com>"]
edition = "2021"
rust-version = "1.75"

[[bin]]
name = "SharpCraftLauncher"
path = "src/main.rs"

[dependencies]
scl-core = { path = "../scl-core" }
scl-gui-widgets = { path = "../scl-gui-widgets" }
scl-gui-animation = { path = "../scl-gui-animation" }
scl-macro = { path = "../scl-macro" }
druid = { git = "https://github.com/linebender/druid.git", features = ["im", "serde", "raw-win-handle"] }
im = { version = "15.1", features = ["serde"] }
anyhow = "^1.0"
dirs = "5"
fs-err = "3"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
toml = "^0.8"
image = { version = "^0.24", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
tracing = "^0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "^0.4"
fastrand = "1.9"
base64 = "^0.21"
zip = { version = "2.6", default-features = false, features = ["deflate"] }
rayon = "=1.10.0"

[target.'cfg(target_os = "linux")'.dependencies]
# 原版 Linux 的非致命后台任务错误弹窗使用 GTK MessageDialog；
# druid 的 GTK 后端已经初始化 GTK，可直接复用同一套 GTK 主循环。
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
taskbar_interface = { git = "https://github.com/Steve-xmh/taskbar_interface.git" }
raw-window-handle-5 = { package = "raw-window-handle", version = "0.5" }
