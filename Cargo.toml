[workspace]
resolver = "2"
members = [
    "scl-macro",
    "scl-core",
    "scl-webview",
    "scl-gui-widgets",
    "scl-gui-animation",
    "scl-gui"
]

# 依赖库在 debug 构建中也做基础优化。Iced 的布局/字体渲染/软件光栅化都在
# 依赖里，纯 O0 时每帧可能要上百毫秒，页面过渡会明显卡顿；启动器自身只做
# 一级优化，仍保留完整调试信息，方便断点调试业务代码。
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
